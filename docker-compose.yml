services:
  crowbar-db:
    image: postgres:16-alpine
    container_name: crowbar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crowbar
      POSTGRES_PASSWORD: crowbar
      POSTGRES_DB: crowbar
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - crowbarDbData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowbar -d crowbar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crowbarDbData:
